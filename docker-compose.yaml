name: learnix-application

services:

  postgres:
    profiles: ["service"]
    image: postgres:16-alpine
    container_name: LearnixDatabase
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-learnix_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-learnix_password}
      - POSTGRES_DB=${POSTGRES_DB:-learnix_database}
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learnix_user} -d ${POSTGRES_DB:-learnix_database}" ]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - learnix-network

  backend:
    profiles: ["backend"]
    build: ./backend
    image: learnix-backend
    container_name: LearnixBackend
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=${DATABASE_URL:-jdbc:postgresql://postgres:5432/learnix_database}
      - POSTGRES_USER=${POSTGRES_USER:-learnix_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-learnix_password}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - learnix-network

  frontend:
    profiles: ["frontend"]
    build:
      context: ./frontend
    image: learnix-frontend
    container_name: LearnixFrontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://backend:8080
    networks:
      learnix-network:

networks:
  learnix-network:
    driver: bridge