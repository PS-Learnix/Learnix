spring:
  application:
    name: LearnixWeb
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://mysql:3306/learnix_database}
    username: ${MYSQL_USER:learnix_user}
    password: ${MYSQL_PASSWORD:learnix_password}
    hikari:
      connection-timeout: 5000
      initialization-fail-timeout: 5000
  jpa:
    show-sql: true
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
springdoc:
  swagger-ui:
    enabled: true
  api-docs:
    enabled: true

logging:
  level:
    org:
      hibernate:
        SQL: DEBUG
        orm:
          jdbc:
            bind: TRACE