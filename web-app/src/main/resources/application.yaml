spring:
  application:
    name: LearnixWeb
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://mysql:3306/learnix_database}
    username: ${MYSQL_USER:learnix_user}
    password: ${MYSQL_PASSWORD:learnix_password}
    hikari:
      connection-timeout: 5000
      initialization-fail-timeout: 5000
  jpa:
    show-sql: false
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
springdoc:
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}

server:
  error:
    include-stacktrace: never
    include-message: never

learnix:
  security:
    allowed-origins: ${LEARNIX_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080}

logging:
  level:
    org:
      hibernate:
        SQL: INFO
        orm:
          jdbc:
            bind: INFO
