<!DOCTYPE html>
<html lang="es"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/main-layout}">
<head>
    <title>Dashboard</title>
</head>
<body>

<div layout:fragment="content">
    <div id="dashboard-content">

        <header class="d-flex justify-content-between align-items-center mb-4">
            <div class="d-flex align-items-center gap-2 bg-primary p-2 rounded-4 shadow">
                <div class="bg-white bg-opacity-25 text-white px-3 py-2 rounded-3 fw-bold small">
                    Mis Cursos
                </div>
                <div class="d-flex gap-1 px-2">
                    <button th:each="course : ${teacherCourses}"
                            th:classappend="${selectedCourse.idCoursePeriod == course.idCoursePeriod} ? 'bg-white text-primary' : 'text-white btn-primary'"
                            class="btn btn-sm rounded-3 fw-bold px-3 py-2 transition-all"
                            th:attr="hx-get=@{/dashboard(coursePeriodId=${course.idCoursePeriod})}"
                            hx-target="#dashboard-content"
                            hx-swap="outerHTML"
                            hx-push-url="true">
                        <span th:text="${course.name} + ' (' + ${course.section} + ')'">Curso (Sección)</span>
                    </button>
                </div>
            </div>

            <div th:if="${selectedCourse != null}">
                <a th:href="@{/asistencia(id=${selectedCourse.idCoursePeriod})}" class="btn btn-primary px-4 py-2 rounded-4 fw-bold shadow">
                    Registrar Asistencia
                </a>
            </div>
        </header>

        <div class="mb-4">
            <h2 class="display-6 fw-black text-dark">
                <span th:if="${selectedCourse != null}"
                      th:text="${selectedCourse.name} + ' (' + ${selectedCourse.section} + ') '">
                    Matemáticas — A
                </span>
                <span th:unless="${selectedCourse != null}">Selecciona un curso</span>
            </h2>
        </div>

        <div th:replace="~{views/dashboard/_stats_cards :: stats-section}"></div>

    </div>
</div>

</body>
</html>
