<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - Learnix</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
    <style>
        .sidebar-panel { background-color: white; border-radius: 2.5rem; width: 100px; height: calc(100vh - 2rem); }
        .main-panel { background-color: white; border-radius: 2.5rem; height: calc(100vh - 2rem); overflow-y: auto; }
        .nav-btn { width: 60px; height: 60px; border-radius: 1.2rem; display: flex; align-items: center; justify-content: center; font-size: 1.5rem; text-decoration: none; }
        .profile-card { border-radius: 3rem; background-color: white; border: 1px solid #f1f5f9; position: relative; overflow: hidden; }
        .stat-card { border-radius: 2.5rem; background-color: white; border: 1px solid #f1f5f9; }
    </style>
</head>
<body class="bg-light p-3">

<div class="d-flex gap-3">
    <aside th:replace="~{layout :: sidebar}"></aside>

    <main class="main-panel flex-grow-1 p-4 shadow-sm border bg-white">
        <div class="d-flex flex-column gap-4">

            <div class="profile-card p-5 shadow-sm d-flex align-items-center gap-4">
                <div class="position-absolute end-0 top-0 p-4 display-1 opacity-10 text-primary" style="font-size: 8rem; user-select: none;">🎓</div>

                <div class="position-relative">
                    <div class="rounded-circle border border-4 border-primary p-1" style="width: 120px; height: 120px;">
                        <img th:src="'https://ui-avatars.com/api/?name=' + ${user.firstName} + '+' + ${user.lastName} + '&size=128&background=1E40AF&color=fff'" class="rounded-circle w-100 h-100 object-fit-cover">
                    </div>
                    <button class="btn btn-primary btn-sm rounded-circle position-absolute bottom-0 end-0 border border-3 border-white p-2 d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">📷</button>
                </div>

                <div class="d-flex flex-col gap-1">
                    <h1 class="fw-black text-dark m-0 lh-1 display-6" th:text="${user.firstName} + ' ' + ${user.lastName}">Nombre Docente</h1>
                    <p class="text-primary fw-bold small uppercase tracking-widest m-0 mt-2 d-flex align-items-center gap-2">
                        <span class="d-inline-block rounded-circle bg-primary" style="width: 8px; height: 8px;"></span>
                        Docente
                    </p>
                    <div class="d-flex gap-3 mt-2 text-muted small">
                        <span th:text="'📧 ' + ${user.email}">Email</span>
                        <span th:text="'🆔 ID: ' + ${user.idUser}">ID</span>
                    </div>
                </div>
            </div>

            <div class="row g-4">

                <div class="col-md-4">
                    <div class="stat-card p-4 shadow-sm d-flex justify-content-between align-items-center">
                        <div>
                            <p class="text-muted fw-bold text-uppercase tracking-wider m-0 mb-1" style="font-size: 10px;">Cursos Activos</p>
                            <h3 class="fw-black text-dark m-0" th:text="${stats.totalCourses}">0</h3>
                        </div>
                        <span class="fs-1">📚</span>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="stat-card p-4 shadow-sm d-flex justify-content-between align-items-center">
                        <div>
                            <p class="text-muted fw-bold text-uppercase tracking-wider m-0 mb-1" style="font-size: 10px;">Total Estudiantes</p>
                            <h3 class="fw-black text-dark m-0" th:text="${stats.totalStudents}">0</h3>
                        </div>
                        <span class="fs-1">👨‍🎓</span>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="stat-card p-4 shadow-sm d-flex justify-content-between align-items-center">
                        <div>
                            <p class="text-muted fw-bold text-uppercase tracking-wider m-0 mb-1" style="font-size: 10px;">Horas Semanales</p>
                            <h3 class="fw-black text-dark m-0">24h</h3>
                        </div>
                        <span class="fs-1">⏱️</span>
                    </div>
                </div>

                <div class="col-lg-8">
                    <div class="profile-card p-4 h-100 shadow-sm">
                        <h4 class="fw-black text-dark mb-4">Configuración de Perfil</h4>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="small fw-bold text-muted text-uppercase tracking-wide mb-1 ms-2">Nombre</label>
                                <input type="text" th:value="${user.firstName}" class="form-control p-3 bg-light rounded-4 border-0" readonly>
                            </div>
                            <div class="col-md-6">
                                <label class="small fw-bold text-muted text-uppercase tracking-wide mb-1 ms-2">Apellido</label>
                                <input type="text" th:value="${user.lastName}" class="form-control p-3 bg-light rounded-4 border-0" readonly>
                            </div>
                            <div class="col-12">
                                <label class="small fw-bold text-muted text-uppercase tracking-wide mb-1 ms-2">Correo Electrónico</label>
                                <input type="email" th:value="${user.email}" class="form-control p-3 bg-light rounded-4 border-0" readonly>
                            </div>
                        </div>
                        <div class="d-flex justify-content-end gap-2 mt-5 pt-3 border-top border-light">
                            <button class="btn btn-link text-secondary text-decoration-none fw-bold px-4 py-2 rounded-3">Cambiar Contraseña</button>
                            <button class="btn btn-primary fw-bold px-4 py-2 rounded-3 shadow">Editar Perfil</button>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="profile-card p-4 h-100 shadow-sm">
                        <h4 class="fw-black text-dark mb-4">Mis Cursos</h4>
                        <div class="d-flex flex-column gap-3">
                            <div th:each="course : ${myCourses}" class="d-flex align-items-center gap-3 p-3 rounded-4 bg-light">
                                <div class="bg-primary bg-opacity-10 text-primary rounded-3 d-flex align-items-center justify-content-center fw-bold" style="width: 40px; height: 40px;" th:text="${#strings.substring(course.name,0,1)}">M</div>
                                <div>
                                    <p class="m-0 small fw-bold text-dark" th:text="${course.name}">Curso</p>
                                    <p class="m-0 text-muted text-uppercase font-monospace fw-black" style="font-size: 9px;" th:text="${course.totalSections} + ' Secciones'">0 Secciones</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
